worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # c-swarm: the app is ~2 MB of JS per page uncompressed and nothing in front of this container compresses
  # (Plane's Caddy proxy, a Cloud Run load balancer). Assets are gzipped at build time (gzip_static); the rest
  # (index.html, the runtime config) on the fly. Those proxies add a Via header, and nginx's default
  # (gzip_proxied off) then sends everything uncompressed, so compress proxied requests too.
  gzip on;
  gzip_static on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  server {
    listen 3000;

    root /usr/share/nginx/html;

    # c-swarm: content-hashed build output never changes under a name; a missing chunk is a 404, not the app shell.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # c-swarm: written at container start (docker-entrypoint.d/40-c-swarm-config.sh); never the SPA fallback, never cached
    location = /c-swarm-config.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      try_files $uri =404;
    }

    # The app shell and everything else: revalidate, so a deploy is picked up on the next load.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}

